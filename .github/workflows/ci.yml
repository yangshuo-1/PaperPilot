name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check import contracts
        run: lint-imports

      - name: Run Ruff
        run: ruff check src

      - name: Check prompt sources
        run: python scripts/check_no_inline_prompt.py

      - name: Compile backend
        run: python -m compileall -q src/paperpilot

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheelsmoke
          /tmp/wheelsmoke/bin/pip install --quiet dist/paperpilot-*.whl
          /tmp/wheelsmoke/bin/paperpilot --version
          /tmp/wheelsmoke/bin/paperpilot --help >/dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Optional populated-browser acceptance. Enable this only on a runner with Chrome/CDP,
  # running backend and frontend services, and a prepared test case.
  # chrome_acceptance:
  #   runs-on: ubuntu-latest
  #   needs: [backend, frontend]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: node scripts/chrome_acceptance.mjs
