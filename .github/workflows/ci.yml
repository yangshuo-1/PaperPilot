name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check import contracts
        run: lint-imports

      - name: Run Ruff
        run: ruff check src

      - name: Check prompt sources
        run: python scripts/check_no_inline_prompt.py

      - name: Compile backend
        run: python -m compileall -q src/paperpilot

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # 发布形态验收：预构建前端 → wheel → 干净环境安装 → 起服务验 / 与 /api/health。
  # 这是 M0 的"新机器 uv tool install 后能起页面"验收项（P0.2/P0.9）。
  wheel:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend bundle into the package
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import zipfile, glob
          wheel = sorted(glob.glob("dist/paperpilot-*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("paperpilot/web/index.html") for n in names), names[:20]
          print(f"{wheel}: {len(names)} entries, SPA bundle present")
          PY

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheelsmoke
          /tmp/wheelsmoke/bin/pip install --quiet dist/paperpilot-*.whl
          /tmp/wheelsmoke/bin/paperpilot --version
          /tmp/wheelsmoke/bin/paperpilot --help >/dev/null

      - name: Serve the wheel and check the page
        run: |
          export PATH="/tmp/wheelsmoke/bin:$PATH"
          export PAPERPOILOT_DATA_DIR="$(mktemp -d)"
          paperpilot serve --port 8123 >/tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:8123/api/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8123/api/health
          echo
          curl -fsS http://127.0.0.1:8123/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/projects)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/definitely-missing)" = "404"
          test -f "$PAPERPOILOT_DATA_DIR/db.sqlite"

      # P0.3 acceptance: a legacy tree is relocated into the data root, paper
      # directories are renamed to <arxiv_id>, and db.sqlite carries the index.
      - name: Migrate a legacy data root with the installed wheel
        run: |
          export PATH="/tmp/wheelsmoke/bin:$PATH"
          legacy="$(mktemp -d)"
          data="$(mktemp -d)/data"
          mkdir -p "$legacy/papers/Qwen3VL_2511.21631/derived" "$legacy/references"
          printf 'x' > "$legacy/papers/Qwen3VL_2511.21631/2511.21631.pdf"
          printf 'text' > "$legacy/papers/Qwen3VL_2511.21631/derived/latex_plain.txt"
          printf '{"schema_version": 1}' > "$legacy/papers/Qwen3VL_2511.21631/manifest.json"
          printf '{"id": "qwen3-vl-2511-21631", "title": "Qwen3-VL", "authors": ["A"], "arxiv_id": "2511.21631", "local_pdf_path": "%s/papers/Qwen3VL_2511.21631/2511.21631.pdf"}\n' "$legacy" > "$legacy/references/paper_index.jsonl"
          paperpilot migrate --legacy-root "$legacy" --data-dir "$data"        # dry run must not touch anything
          test ! -e "$data"
          paperpilot migrate --legacy-root "$legacy" --data-dir "$data" --apply
          test -f "$data/papers/2511.21631/2511.21631.pdf"
          test -f "$data/papers/2511.21631/manifest.json"
          test -f "$data/db.sqlite"
          python - "$data" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          record = json.loads((root / "references" / "paper_index.jsonl").read_text().splitlines()[0])
          assert record["local_pdf_path"].startswith(str(root / "papers" / "2511.21631")), record
          marker = json.loads((root / ".migration.json").read_text())
          assert marker["papers"] == [str(root / "papers" / "2511.21631")], marker
          print("migrate OK:", marker["papers"])
          PY

  # Optional populated-browser acceptance. Enable this only on a runner with Chrome/CDP,
  # running backend and frontend services, and a prepared test case.
  # chrome_acceptance:
  #   runs-on: ubuntu-latest
  #   needs: [backend, frontend]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: node scripts/chrome_acceptance.mjs
