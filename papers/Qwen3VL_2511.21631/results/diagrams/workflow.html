ual knowledge collections, and optical character recognition (OCR) data."><b>Training Data</b><small>Curated image-caption, visual knowledge, and OCR data used for alignment.</small></button><button class="node role-module" type="button" style="left:290px;top:28px;background:#ffffff;border-color:#ccd5df" data-evidence-page="0" data-evidence-section="Model Architecture" data-evidence-quote="We utilize the SigLIP-2 architecture as our vision encoder and continue training it with dynamic input resolutions"><b>Vision Encoder</b><small>SigLIP-2 vision encoder trained with dynamic input resolutions.</small></button><button class="node role-module" type="button" style="left:290px;top:180px;background:#ffffff;border-color:#ccd5df" data-evidence-page="0" data-evidence-section="Model Architecture" data-evidence-quote="we use a two-layer MLP to compress visual features from the vision encoder into a single visual token, aligned with the LLM’s hidden dimension."><b>VL Merger</b><small>Two-layer MLP compresses visual features into visual tokens aligned with the LLM.</small></button><button class="node role-module" type="button" style="left:290px;top:332px;background:#ffffff;border-color:#ccd5df" data-evidence-page="0" data-evidence-section="Model Architecture" data-evidence-quote="Qwen3-VL adopts a three-module architecture comprising a vision encoder, an MLP-based vision–language merger, and a large language model (LLM)."><b>LLM Backbone</b><small>Qwen3 large language model backbone in the three-module architecture.</small></button><button class="node role-module" type="button" style="left:552px;top:28px;background:#ffffff;border-color:#ccd5df" data-evidence-page="0" data-evidence-section="Introduction" data-evidence-quote="We therefore adopt an interleaved MRoPE that distributes t, h, and w uniformly across low- and high-frequency bands"><b>Interleaved MRoPE</b><small>Positional encoding that interleaves temporal, horizontal, and vertical components.</small></button><button cl
