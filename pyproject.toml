[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These are migration-era files. Keep their current behavior unchanged while new modules use
# the full baseline above.
"backend/app/codex_jobs.py" = ["E702"]
"backend/app/main.py" = ["E701", "E702", "F401"]
"backend/app/projects.py" = ["E701", "E702", "E703"]
"backend/app/storage.py" = ["F821", "F841"]
"backend/app/translation_jobs.py" = ["E702", "F821"]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["backend"]
exclude = ["**/__pycache__", "**/dist", "**/node_modules"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.importlinter]
root_package = "backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is framework independent"
type = "forbidden"
source_modules = ["backend.app.domain.*"]
forbidden_modules = ["fastapi", "pydantic"]
as_packages = true

[[tool.importlinter.contracts]]
name = "Stores do not import domain"
type = "forbidden"
source_modules = ["backend.app.stores.*"]
forbidden_modules = ["backend.app.domain", "backend.app.domain.*"]
as_packages = true

[[tool.importlinter.contracts]]
# Concrete jobs are independent of each other but may import the shared base.
name = "Jobs do not import sibling jobs"
type = "forbidden"
source_modules = ["backend.app.jobs.*"]
forbidden_modules = ["backend.app.jobs.*"]
ignore_imports = ["backend.app.jobs.* -> backend.app.jobs.base"]
as_packages = true
